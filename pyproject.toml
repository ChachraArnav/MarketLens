[project]
name = "marketlens"
version = "1.0.0"
description = "Historical analytics and downside-risk research for Canadian-listed ETFs"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app_portfolio.py", "app_*backup*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
# The dashboard keeps its inline CSS and chart styling on long lines.
"app.py" = ["E501"]
